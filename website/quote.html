<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Estimate — Dynasty Marine Customs | Sarasota, FL</title>
<meta name="description" content="Answer a few quick questions and we'll build a tailored marine service estimate. Free estimates within 48 hours across Florida's Suncoast.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dynasty.css">
<style>
/* ---- quote wizard (page-specific, built on Dynasty tokens) ---- */
.quote-wrap{max-width:820px; margin:0 auto; padding:clamp(28px,5vw,64px) var(--gutter) clamp(60px,9vw,110px);
  min-height:calc(100vh - 76px); display:flex; flex-direction:column}
.q-top{display:flex; align-items:center; gap:16px; margin-bottom:clamp(26px,5vw,48px)}
.q-back{display:inline-flex; align-items:center; gap:7px; font-family:var(--font-display); font-size:13px;
  font-weight:var(--fw-semibold); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--text-secondary);
  background:transparent; border:none; cursor:pointer; padding:6px 2px; transition:color var(--dur-base) var(--ease-standard)}
.q-back:hover{color:var(--brand-primary)}
.q-back[hidden]{visibility:hidden}
.q-prog{flex:1; height:4px; background:var(--fog); overflow:hidden}
.q-prog i{display:block; height:100%; width:0; background:var(--brand-primary); transition:width .45s var(--ease-standard)}
.q-count{font-family:var(--font-display); font-size:var(--fs-caption); font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--text-muted); white-space:nowrap;
  font-variant-numeric:tabular-nums}

.q-stage{flex:1}
.q-card{animation:qin .34s var(--ease-standard)}
@keyframes qin{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
@media(prefers-reduced-motion:reduce){.q-card{animation:none}}
.q-kick{display:block; margin-bottom:14px}
.q-h{font-family:var(--font-display); font-size:clamp(28px,4.6vw,var(--fs-display-lg)); font-weight:var(--fw-bold);
  line-height:var(--lh-tight); letter-spacing:var(--ls-display); color:var(--text-primary); max-width:20ch}
.q-sub{font-family:var(--font-body); color:var(--text-secondary); font-size:var(--fs-body-md);
  line-height:var(--lh-body); margin-top:14px; max-width:48ch}

.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:clamp(26px,4vw,40px)}
.opts.one{grid-template-columns:1fr}
.opt{position:relative; text-align:left; background:var(--surface-card); border:1px solid var(--border-default);
  border-radius:var(--radius-sm); padding:20px 22px; cursor:pointer; font-family:inherit;
  transition:border-color var(--dur-base) var(--ease-standard), background var(--dur-base) var(--ease-standard);
  display:flex; flex-direction:column; gap:5px}
.opt:hover{border-color:var(--ink-300)}
.opt.sel{border-color:var(--brand-primary); background:var(--red-100)}
.opt .ot{font-family:var(--font-display); font-weight:var(--fw-semibold); font-size:18px;
  color:var(--text-primary); padding-right:30px}
.opt .od{font-family:var(--font-body); font-size:var(--fs-body-sm); color:var(--text-secondary); line-height:1.45}
.opt .ck{position:absolute; top:16px; right:16px; width:22px; height:22px; border-radius:50%;
  border:1.5px solid var(--border-default); display:flex; align-items:center; justify-content:center;
  transition:var(--dur-base) var(--ease-standard); color:var(--white)}
.opt.sel .ck{background:var(--brand-primary); border-color:var(--brand-primary)}
.opt:not(.sel) .ck svg{opacity:0}
.opt.multi .ck{border-radius:var(--radius-sm)}
@media(max-width:560px){.opts{grid-template-columns:1fr}}

.q-actions{display:flex; align-items:center; gap:16px; margin-top:clamp(28px,4vw,40px); flex-wrap:wrap}
.q-skip{background:transparent; border:none; cursor:pointer; font-family:var(--font-body); font-size:var(--fs-body-sm);
  font-weight:var(--fw-semibold); color:var(--text-muted); text-decoration:underline; text-underline-offset:3px;
  transition:color var(--dur-base) var(--ease-standard)}
.q-skip:hover{color:var(--brand-primary)}
.q-note{font-family:var(--font-body); font-size:var(--fs-body-sm); color:var(--text-muted)}

/* mini dual-select block (engine) */
.q-block{margin-top:26px}
.q-block + .q-block{margin-top:24px}
.q-bl-l{font-family:var(--font-display); font-size:var(--fs-caption); font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--brand-primary); margin-bottom:12px}
.chips{display:flex; flex-wrap:wrap; gap:9px}
.chip{background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--radius-sm);
  padding:10px 18px; font-family:var(--font-display); font-size:14px; font-weight:var(--fw-medium);
  letter-spacing:.02em; color:var(--text-secondary); cursor:pointer;
  transition:var(--dur-base) var(--ease-standard)}
.chip:hover{border-color:var(--ink-300)}
.chip.sel{background:var(--brand-primary); border-color:var(--brand-primary); color:var(--white)}

/* form */
.fields{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:clamp(26px,4vw,38px)}
.fields .field{display:flex; flex-direction:column; gap:7px; margin:0}
.fields .field.full{grid-column:1/-1}
.fields .field label{font-family:var(--font-display); font-size:var(--fs-caption); font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--text-secondary)}
.fields .field label .req{color:var(--brand-primary)}
.fields .field input, .fields .field textarea{font-family:var(--font-body); font-size:var(--fs-body-md);
  color:var(--text-primary); background:var(--surface-card); border:1px solid var(--border-default);
  border-radius:var(--radius-sm); padding:14px 16px; width:100%;
  transition:border-color var(--dur-base) var(--ease-standard)}
.fields .field input:focus, .fields .field textarea:focus{outline:2px solid var(--focus-ring); outline-offset:1px;
  border-color:var(--brand-primary)}
.fields .field textarea{resize:vertical; min-height:96px}
.fields .field .err{font-family:var(--font-body); font-size:13px; color:var(--brand-primary);
  font-weight:var(--fw-semibold); display:none}
.fields .field.invalid input{border-color:var(--brand-primary)}
.fields .field.invalid .err{display:block}
@media(max-width:560px){.fields{grid-template-columns:1fr}}

/* review */
.rev-list{margin-top:clamp(24px,4vw,36px); border-top:1px solid var(--border-default)}
.rev-row{display:grid; grid-template-columns:minmax(0,.5fr) minmax(0,1fr) auto; gap:18px; align-items:baseline;
  padding:16px 4px; border-bottom:1px solid var(--border-default)}
.rev-row .rk{font-family:var(--font-display); font-size:var(--fs-caption); font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--text-muted)}
.rev-row .rv{font-family:var(--font-body); font-size:var(--fs-body-md); color:var(--text-primary)}
.rev-row .re{font-family:var(--font-body); font-size:13px; font-weight:var(--fw-semibold); color:var(--brand-primary);
  background:transparent; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.rev-cta{margin-top:clamp(30px,4vw,42px); display:flex; gap:14px; flex-wrap:wrap; align-items:center}
.rev-fine{font-family:var(--font-body); font-size:13px; color:var(--text-muted); margin-top:20px;
  max-width:54ch; line-height:var(--lh-body)}

/* thank you */
.ty{text-align:center; max-width:560px; margin:clamp(30px,8vw,80px) auto 0}
.ty .seal{width:66px; height:66px; border-radius:50%; background:var(--red-100); border:2px solid var(--red-500);
  display:flex; align-items:center; justify-content:center; margin:0 auto 26px; color:var(--brand-primary)}
.ty h2{font-family:var(--font-display); font-size:clamp(30px,5vw,var(--fs-display-lg)); font-weight:var(--fw-bold);
  line-height:var(--lh-tight); letter-spacing:var(--ls-display)}
.ty p{font-family:var(--font-body); color:var(--text-secondary); font-size:var(--fs-body-lg);
  line-height:var(--lh-body); margin-top:18px}
.ty .acts{margin-top:34px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
</style>
</head>
<body>

<header class="site">
  <div class="wrap masthead">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="Dynasty Marine Customs"></a>
    <div class="addr">6760 15th St E, Unit A &middot; Sarasota, FL 34243</div>
    <nav class="mnav">
      <a class="lk" href="index.html">Back to site</a>
      <a class="btn btn-outline btn-sm" href="tel:+19412809742">(941) 280-9742</a>
    </nav>
  </div>
</header>

<main class="quote-wrap">
  <div class="q-top">
    <button class="q-back" id="qBack" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
    <div class="q-prog"><i id="qBar"></i></div>
    <span class="q-count" id="qCount">Step 1</span>
  </div>
  <div class="q-stage" id="qStage"></div>
</main>

<script>
const PHONE='+19412809742', PHONE_DISPLAY='(941) 280-9742', EMAIL='info@dynastymarinecustoms.com';
const A={vessel:'',needs:[],engineType:'',engineCount:'',elec:[],lastService:'',installs:[],timeframe:'',budget:'',name:'',phone:'',email:'',makeModel:'',location:'',notes:''};

const check='<span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>';

/* single-select option sets */
const VESSELS=[
  ['Center console','Bay boats, flats, offshore'],
  ['Cruiser / express','Cabin cruisers & express'],
  ['Motoryacht','Larger inboard vessels'],
  ['Sailboat','Auxiliary diesel & rigging'],
  ['Pontoon','Tri-toons & pontoons'],
  ['Catamaran','Power or sail cats'],
  ['Other / not sure',"We'll figure it out"],
];
const NEEDS=[
  ['Annual service & maintenance','Seasonal inspection, keep her survey-ready'],
  ['Engine repower','New diesel, gas, or outboard power'],
  ['Outdrive & outboard','Lower unit, gearcase, outboard service'],
  ['Marine electronics','Nav, switching, radar, audio'],
  ['Oil, fuel & cooling','Oil changes, fuel & cooling care'],
  ['Custom install','Audio, SeaDek, lighting, PPF & more'],
  ['Not sure — diagnose it',"Something's off, help us pin it down"],
];
const TIMEFRAME=[
  ['ASAP','Something needs attention now'],
  ['This month','Ready to schedule soon'],
  ['This season','Planning the next few weeks'],
  ['Just planning ahead','Gathering info for later'],
];
const BUDGET=[
  ['Under $1,000',''],['$1,000 – $5,000',''],['$5,000 – $15,000',''],['$15,000+',''],['Not sure yet',"That's fine — we'll advise"],
];
const ELEC=[['New display / chartplotter'],['Full nav & radar package'],['Digital switching & monitoring'],['Marine audio'],['Not sure yet']];
const INSTALLS=[['Marine audio (Wet Sounds)'],['SeaDek flooring'],['Lighting (Lumitec)'],['Anchor (PowerPole / Minn Kota)'],['Paint protection film'],['Something else']];

function buildFlow(){
  const f=['vessel','needs'];
  if(A.needs.includes('Engine repower')) f.push('engine');
  else if(A.needs.includes('Marine electronics')) f.push('elec');
  else if(A.needs.includes('Annual service & maintenance')) f.push('service');
  else if(A.needs.includes('Custom install')) f.push('install');
  f.push('timeframe','budget','details','review');
  return f;
}
let idx=0, done=false;

const stage=document.getElementById('qStage');
const bar=document.getElementById('qBar'), count=document.getElementById('qCount'), back=document.getElementById('qBack');

function render(){
  const flow=buildFlow();
  if(idx>=flow.length) idx=flow.length-1;
  const id=flow[idx];
  const total=flow.length;
  bar.style.width=((idx)/(total-1)*100)+'%';
  count.textContent=done?'Done':`Step ${idx+1} / ${total}`;
  back.hidden = idx===0 || done;
  stage.innerHTML=SCREENS[id]();
  wire(id);
}

/* ---------- screen templates ---------- */
function optCards(list,selected,multi){
  return `<div class="opts">`+list.map(o=>{
    const val=o[0]; const sel=multi?selected.includes(val):selected===val;
    return `<button class="opt ${multi?'multi':''} ${sel?'sel':''}" data-v="${val}">
      ${check}
      <span class="ot">${val}</span>${o[1]?`<span class="od">${o[1]}</span>`:''}
    </button>`;
  }).join('')+`</div>`;
}
const SCREENS={
  vessel:()=>`<div class="q-card">
    <span class="eyebrow q-kick">Free estimate &middot; 48 hours</span>
    <h1 class="q-h">First — What Are We Working On?</h1>
    <p class="q-sub">Pick the vessel closest to yours. This helps us match the right technician and parts.</p>
    ${optCards(VESSELS,A.vessel,false)}
  </div>`,
  needs:()=>`<div class="q-card">
    <span class="eyebrow q-kick">What you need</span>
    <h1 class="q-h">What Can We Help With?</h1>
    <p class="q-sub">Choose everything that applies — you can pick more than one.</p>
    ${optCards(NEEDS,A.needs,true)}
    <div class="q-actions">
      <button class="btn btn-primary" id="cont">Continue</button>
      <span class="q-note" id="needNote">Select at least one to continue</span>
    </div>
  </div>`,
  engine:()=>`<div class="q-card">
    <span class="eyebrow q-kick">Repower details</span>
    <h1 class="q-h">Tell Us About Her Current Power.</h1>
    <p class="q-sub">A rough idea is plenty — we'll confirm the specifics on site.</p>
    <div class="q-block">
      <div class="q-bl-l">Current engine</div>
      <div class="chips" data-grp="engineType">
        ${['Outboard','Inboard diesel','Inboard gas','Sterndrive (I/O)','Not sure'].map(v=>`<button class="chip ${A.engineType===v?'sel':''}" data-v="${v}">${v}</button>`).join('')}
      </div>
    </div>
    <div class="q-block">
      <div class="q-bl-l">How many engines</div>
      <div class="chips" data-grp="engineCount">
        ${['1','2','3+'].map(v=>`<button class="chip ${A.engineCount===v?'sel':''}" data-v="${v}">${v}</button>`).join('')}
      </div>
    </div>
    <div class="q-actions"><button class="btn btn-primary" id="cont">Continue</button></div>
  </div>`,
  elec:()=>`<div class="q-card">
    <span class="eyebrow q-kick">Electronics</span>
    <h1 class="q-h">What Are You After at the Helm?</h1>
    <p class="q-sub">Pick anything that fits — we install and calibrate it all.</p>
    ${optCards(ELEC,A.elec,true)}
    <div class="q-actions"><button class="btn btn-primary" id="cont">Continue</button></div>
  </div>`,
  service:()=>`<div class="q-card">
    <span class="eyebrow q-kick">Maintenance</span>
    <h1 class="q-h">When Was Her Last Full Service?</h1>
    <p class="q-sub">This helps us scope how thorough the inspection needs to be.</p>
    ${optCards([['This season'],['Last year'],['2+ years ago'],['New to me / unknown']],A.lastService,false)}
  </div>`,
  install:()=>`<div class="q-card">
    <span class="eyebrow q-kick">Custom install</span>
    <h1 class="q-h">What Are We Adding?</h1>
    <p class="q-sub">Select everything you're considering.</p>
    ${optCards(INSTALLS,A.installs,true)}
    <div class="q-actions"><button class="btn btn-primary" id="cont">Continue</button></div>
  </div>`,
  timeframe:()=>`<div class="q-card">
    <span class="eyebrow q-kick">Timing</span>
    <h1 class="q-h">When Would You Like to Get on the Schedule?</h1>
    ${optCards(TIMEFRAME,A.timeframe,false)}
  </div>`,
  budget:()=>`<div class="q-card">
    <span class="eyebrow q-kick">Budget &middot; optional</span>
    <h1 class="q-h">Any Budget in Mind?</h1>
    <p class="q-sub">Totally optional — it just helps us tailor the recommendation to what matters most to you.</p>
    ${optCards(BUDGET,A.budget,false)}
    <div class="q-actions"><button class="q-skip" id="skip">Skip this step</button></div>
  </div>`,
  details:()=>`<div class="q-card">
    <span class="eyebrow q-kick">Almost done</span>
    <h1 class="q-h">Where Should We Send the Estimate?</h1>
    <p class="q-sub">We'll reach out within 48 hours. No spam, no obligation.</p>
    <div class="fields">
      <div class="field" data-f="name"><label>Name <span class="req">*</span></label><input id="f-name" value="${esc(A.name)}" placeholder="Your name" autocomplete="name"><span class="err">Please add your name</span></div>
      <div class="field" data-f="phone"><label>Phone <span class="req">*</span></label><input id="f-phone" value="${esc(A.phone)}" placeholder="(941) 000-0000" inputmode="tel" autocomplete="tel"><span class="err">Please add a phone number</span></div>
      <div class="field full" data-f="email"><label>Email <span class="req">*</span></label><input id="f-email" value="${esc(A.email)}" placeholder="you@email.com" inputmode="email" autocomplete="email"><span class="err">Please add a valid email</span></div>
      <div class="field" data-f="makeModel"><label>Vessel make &amp; model</label><input id="f-mm" value="${esc(A.makeModel)}" placeholder="e.g. Grady-White 282"></div>
      <div class="field" data-f="location"><label>Where's she kept?</label><input id="f-loc" value="${esc(A.location)}" placeholder="Marina or city"></div>
      <div class="field full" data-f="notes"><label>Anything else we should know?</label><textarea id="f-notes" placeholder="Symptoms, deadlines, questions…">${esc(A.notes)}</textarea></div>
    </div>
    <div class="q-actions"><button class="btn btn-primary" id="cont">Review request</button></div>
  </div>`,
  review:()=>{
    const rows=summaryRows();
    return `<div class="q-card">
      <span class="eyebrow q-kick">Review</span>
      <h1 class="q-h">Here's What We'll Send.</h1>
      <p class="q-sub">Give it a look — tap edit on anything you'd like to change.</p>
      <div class="rev-list">${rows}</div>
      <div class="rev-cta">
        <button class="btn btn-primary" id="send">Send to Dynasty</button>
        <a class="btn btn-outline" href="tel:${PHONE}">Or call ${PHONE_DISPLAY}</a>
      </div>
      <p class="rev-fine">Tapping &ldquo;Send&rdquo; opens a pre-filled email to our shop with your answers — just hit send in your mail app. Prefer to talk it through? Give us a call anytime during shop hours.</p>
    </div>`;
  },
  thanks:()=>`<div class="ty q-card">
    <div class="seal"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h2>Your Request Is Ready.</h2>
    <p>We just opened a pre-filled email in your mail app — hit send and we'll get back to you within 48 hours. Didn't see it open? Call us and we'll take the details over the phone.</p>
    <div class="acts">
      <a class="btn btn-primary" href="tel:${PHONE}">Call ${PHONE_DISPLAY}</a>
      <a class="btn btn-outline" href="index.html">Back to site</a>
    </div>
  </div>`
};

/* ---------- wiring ---------- */
function wire(id){
  stage.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>onOpt(id,el)));
  stage.querySelectorAll('.chip').forEach(el=>el.addEventListener('click',()=>{
    const grp=el.closest('.chips').dataset.grp;
    A[grp]=el.dataset.v;
    el.closest('.chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===el));
  }));
  const cont=stage.querySelector('#cont'); if(cont) cont.addEventListener('click',()=>onContinue(id));
  const skip=stage.querySelector('#skip'); if(skip) skip.addEventListener('click',()=>{A.budget=A.budget||'—skipped—';next();});
  const send=stage.querySelector('#send'); if(send) send.addEventListener('click',submit);
  stage.querySelectorAll('.re').forEach(el=>el.addEventListener('click',()=>{idx=parseInt(el.dataset.to,10);done=false;render();}));
  const map={'f-name':'name','f-phone':'phone','f-email':'email','f-mm':'makeModel','f-loc':'location','f-notes':'notes'};
  Object.entries(map).forEach(([fid,key])=>{const inp=stage.querySelector('#'+fid); if(inp) inp.addEventListener('input',e=>A[key]=e.target.value);});
}
function onOpt(id,el){
  const v=el.dataset.v;
  if(id==='needs'){ toggleMulti('needs',v,el); const n=stage.querySelector('#needNote'); if(n) n.style.display=A.needs.length?'none':''; return; }
  if(id==='elec'){ toggleMulti('elec',v,el); return; }
  if(id==='install'){ toggleMulti('installs',v,el); return; }
  const key = id==='vessel'?'vessel': id==='timeframe'?'timeframe': id==='budget'?'budget': id==='service'?'lastService':null;
  if(!key) return;
  A[key]=v;
  stage.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===el));
  setTimeout(next,240);
}
function toggleMulti(key,v,el){
  const arr=A[key]; const i=arr.indexOf(v);
  if(i>=0) arr.splice(i,1); else arr.push(v);
  el.classList.toggle('sel');
}
function onContinue(id){
  if(id==='needs' && !A.needs.length){ const n=stage.querySelector('#needNote'); if(n){n.style.color='var(--brand-primary)';} return; }
  if(id==='details'){ if(!validate()) return; }
  next();
}
function validate(){
  let ok=true;
  const set=(f,bad)=>{const el=stage.querySelector(`.field[data-f="${f}"]`); el.classList.toggle('invalid',bad); if(bad)ok=false;};
  set('name',!A.name.trim());
  set('phone',A.phone.replace(/\D/g,'').length<7);
  set('email',!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email.trim()));
  return ok;
}
function next(){ idx++; render(); scrollTo({top:0,behavior:'smooth'}); }
back.addEventListener('click',()=>{ if(idx>0){idx--; render(); scrollTo({top:0,behavior:'smooth'});} });

/* ---------- summary + submit ---------- */
function summaryFields(){
  const flow=buildFlow();
  const items=[];
  items.push(['Vessel',A.vessel||'—',flow.indexOf('vessel')]);
  items.push(['Needs',A.needs.length?A.needs.join(', '):'—',flow.indexOf('needs')]);
  if(flow.includes('engine')) items.push(['Engine',[A.engineType,A.engineCount&&A.engineCount+' engine(s)'].filter(Boolean).join(' · ')||'—',flow.indexOf('engine')]);
  if(flow.includes('elec')) items.push(['Electronics',A.elec.join(', ')||'—',flow.indexOf('elec')]);
  if(flow.includes('service')) items.push(['Last service',A.lastService||'—',flow.indexOf('service')]);
  if(flow.includes('install')) items.push(['Install',A.installs.join(', ')||'—',flow.indexOf('install')]);
  items.push(['Timeframe',A.timeframe||'—',flow.indexOf('timeframe')]);
  items.push(['Budget',(A.budget&&A.budget!=='—skipped—')?A.budget:'Not specified',flow.indexOf('budget')]);
  const contact=[A.name,A.phone,A.email].filter(Boolean).join(' · ');
  items.push(['Contact',contact||'—',flow.indexOf('details')]);
  if(A.makeModel) items.push(['Make / model',A.makeModel,flow.indexOf('details')]);
  if(A.location) items.push(['Kept at',A.location,flow.indexOf('details')]);
  if(A.notes) items.push(['Notes',A.notes,flow.indexOf('details')]);
  return items;
}
function summaryRows(){
  return summaryFields().map(([k,v,to])=>`<div class="rev-row">
    <span class="rk">${k}</span><span class="rv">${esc(v)}</span>
    <button class="re" data-to="${to}">Edit</button></div>`).join('');
}
function submit(){
  const lines=['New estimate request — Dynasty Marine Customs','',...summaryFields().map(([k,v])=>`${k}: ${v}`),'','— Sent from dynastymarinecustoms.com'];
  const subject=`Estimate request — ${A.vessel||'Marine service'}${A.name?' — '+A.name:''}`;
  location.href=`mailto:${EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join('\n'))}`;
  done=true; back.hidden=true; bar.style.width='100%'; count.textContent='Done';
  stage.innerHTML=SCREENS.thanks();
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

render();
</script>
</body>
